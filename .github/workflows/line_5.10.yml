# ============================================================
# 线级入口: 一次 dispatch 构建本线全部 8 个子版本(66/110/149/168/198/209/226/236)
# 单版本 workflow 已转为 workflow_call 可复用模块(不在 Actions 列表显示)
# only_sub_level 留空 = 全部; 填子版本号 = 只建该版本
# 每个子版本独立出 AK3 包、独立 release, 与原单版本构建行为一致
# ============================================================
name: "内核构建 - Linux 5.10（8 个子版本: 66/110/149/168/198/209/226/236）"

permissions:
  contents: write
  actions: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      only_sub_level:
        description: '只构建指定子版本(留空=全部; 可填 66/110/149/168/198/209/226/236)'
        required: false
        type: string
        default: ''
      ksu_type:
        description: "KernelSU分支(ReSukiSU/SukiSU Ultra/KernelSU Next/KSU(原版)/无内置KSU,默认ReSukiSU)"
        required: true
        type: choice
        default: "resukisu"
        options:
          - "resukisu"
          - "sukisu"
          - "ksunext"
          - "ksu"
          - "none"
      susfs_enable:
        description: "是否开启susfs(用于增强隐藏环境挂载功能; 可能轻微增加耗电，上游更新导致不稳定时或不需要可关闭)"
        required: true
        type: boolean
        default: true
      kpm_enable:
        description: "是否开启kpm(使用KpatchNext独立实现kpm(支持任意KSU/面具环境); 不需要可保持默认关闭)"
        required: true
        type: boolean
        default: true
      lz4_enable:
        description: "是否安装 lz4 1.10.0+zstd 1.5.7 补丁(5.10适配性未验证,建议关闭)"
        required: true
        type: boolean
        default: false
      lz4kd_enable:
        description: "是否安装 LZ4KD 补丁(若已开启lz4+zstd补丁则可不开启)"
        required: true
        type: boolean
        default: false
      bbr_enable:
        description: "是否启用bbr算法(优化上行数据,对手机日用无太大意义甚至可能负优化;false关闭,true仅加入算法,default设为默认)"
        required: true
        type: choice
        default: "false"
        options:
          - "false"
          - "true"
          - "default"
      better_net:
        description: "是否开启网络功能拓展配置(用于为ipset及需要iptables等高级网络功能内核支持的程序提供支持)"
        required: true
        type: boolean
        default: false
      ssg_enable:
        description: "是否启用三星SSG IO调度器支持(提升IO读写性能; 部分机型开启后可能导致bug)"
        required: true
        type: boolean
        default: true
      rekernel_enable:
        description: "是否启用Re-Kernel支持(与Freezer/NoActive等软件配合, 提升应用冻结能力)"
        required: true
        type: boolean
        default: false
      baseband_guard:
        description: "是否开启内核级基带保护(阻止一切对非用户分区的写入，有效防止格机;5.10适配性未验证,建议先关闭)"
        required: true
        type: boolean
        default: false
      ccache_update:
        description: "更新ccache缓存(将本次编译生成的ccache缓存覆盖至仓库缓存，在更改编译配置、源码或需要刷新缓存时开启)"
        required: true
        type: boolean
        default: false
      ccache_debug:
        description: "是否上传 Ccache调试日志(用于调试, 无需要不必开启)"
        required: true
        type: boolean
        default: false
      kernel_suffix:
        description: "内核后缀(留空默认,开头别加连字符,勿加空格等影响指令运行的保留字符)"
        required: false
        type: string
        default: ""

jobs:
  v66:
    if: ${{ inputs.only_sub_level == '' || inputs.only_sub_level == '66' }}
    uses: BailinT/oppo_oplus_realme_all-hwid/.github/workflows/fastbuild_5.10.66.yml@modules
    with:
        ksu_type: ${{ inputs.ksu_type }}
        susfs_enable: ${{ inputs.susfs_enable }}
        kpm_enable: ${{ inputs.kpm_enable }}
        lz4_enable: ${{ inputs.lz4_enable }}
        lz4kd_enable: ${{ inputs.lz4kd_enable }}
        bbr_enable: ${{ inputs.bbr_enable }}
        better_net: ${{ inputs.better_net }}
        ssg_enable: ${{ inputs.ssg_enable }}
        rekernel_enable: ${{ inputs.rekernel_enable }}
        baseband_guard: ${{ inputs.baseband_guard }}
        ccache_update: ${{ inputs.ccache_update }}
        ccache_debug: ${{ inputs.ccache_debug }}
        kernel_suffix: ${{ inputs.kernel_suffix }}
    secrets: inherit
  v110:
